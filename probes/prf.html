<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiado passkey probe</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f4ef; --fg: #1d1c1a; --ok: #1f7a4d; --bad: #b3261e; --line: #d8d3c7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #ece8df; --ok: #6fd3a0; --bad: #ff8a80; --line: #3a372f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  button { font: inherit; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--fg); color: var(--bg); width: 100%; margin: 8px 0; }
  pre { white-space: pre-wrap; word-break: break-all; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Fiado passkey probe (Q3)</h1>
  <p>Tests whether this phone's passkeys support the PRF extension, which lets Fiado derive a Stellar key from a passkey with no seed phrase. Nothing leaves this phone.</p>
  <button id="create">1. Create a test passkey</button>
  <button id="get">2. Use it (read PRF)</button>
  <pre id="out">Waiting.</pre>
  <p>Screenshot the result and send it back.</p>
</main>
<script>
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };
const salt = new TextEncoder().encode('fiado-prf-probe-salt-v1-000000000').slice(0, 32);
let credId = null;

out.textContent = 'UA: ' + navigator.userAgent + '\nsecure context: ' + window.isSecureContext +
  '\nPublicKeyCredential: ' + (typeof PublicKeyCredential);

document.getElementById('create').onclick = async () => {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Fiado probe' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'probe', displayName: 'Fiado probe' },
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
      extensions: { prf: { eval: { first: salt } } },
    }});
    credId = cred.rawId;
    const ext = cred.getClientExtensionResults();
    log('create: ok. prf.enabled = ' + (ext.prf && ext.prf.enabled));
    if (ext.prf && ext.prf.results && ext.prf.results.first) log('create already returned PRF: ' + ext.prf.results.first.byteLength + ' bytes');
  } catch (e) { log('create FAILED: ' + e.name + ': ' + e.message); }
};

document.getElementById('get').onclick = async () => {
  try {
    const opts = {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      userVerification: 'required',
      extensions: { prf: { eval: { first: salt } } },
    };
    if (credId) opts.allowCredentials = [{ type: 'public-key', id: credId }];
    const a = await navigator.credentials.get({ publicKey: opts });
    const r = a.getClientExtensionResults();
    const first = r.prf && r.prf.results && r.prf.results.first;
    if (first && first.byteLength === 32) {
      const h = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', first))).slice(0, 4).map(b => b.toString(16).padStart(2, '0')).join('');
      out.innerHTML += '\n<span class="ok">PASS: PRF returned 32 bytes (fingerprint ' + h + '). Run step 2 again: the fingerprint must be the same.</span>';
    } else {
      out.innerHTML += '\n<span class="bad">FAIL: no PRF result. ext = ' + JSON.stringify(r) + '</span>';
    }
  } catch (e) { log('get FAILED: ' + e.name + ': ' + e.message); }
};
</script>
</body>
</html>
